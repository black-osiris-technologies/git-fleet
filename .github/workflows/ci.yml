name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches:
      - "feature/**"
      - "defect/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/git-fleet
