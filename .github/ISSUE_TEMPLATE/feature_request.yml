name: Feature request
description: Propose an improvement with a concrete workflow and safety model.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which multi-repository workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Explain dry-run behavior, failure modes, and destructive-operation risk.
    validations:
      required: true
